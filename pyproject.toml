[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lutlab"
version = "0.3.0"
description = "A small library and testbed for colour LUTs and LUT-based methods"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
fast = ["numba>=0.57"]                       # multi-threaded CPU kernels
torch = ["torch>=2.0"]                       # differentiable / GPU kernels, learned methods
clip = ["torch>=2.0", "open_clip_torch>=2.20"]   # CLIP scorer for PG-IA-NILUT
metrics = ["scikit-image>=0.20"]             # CIEDE2000, SSIM
eval = ["scikit-image>=0.20", "imageio>=2.30"]
all = ["numba>=0.57", "torch>=2.0", "open_clip_torch>=2.20", "scikit-image>=0.20", "imageio>=2.30"]
dev = ["pytest>=7", "scipy>=1.9", "scikit-image>=0.20", "imageio>=2.30", "numba>=0.57"]

[tool.hatch.build.targets.wheel]
packages = ["lutlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:lutlab"]
